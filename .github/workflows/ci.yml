name: CI
on:
  push:
    branches: [main]
  pull_request:
# Só leitura: nenhum job escreve no repositório, e os scripts de instalação
# (npm ci, uv sync) rodam código de terceiros.
permissions:
  contents: read
jobs:
  python:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run python -m pytest -q
  front:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  pacote:
    timeout-minutes: 20
    needs: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.12.13
      - run: cd front && npm ci && npm run build
      - run: uv build
      - run: python -m scripts.empacotamento.conferir_wheel dist/*.whl
      - run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requisitos-auditoria.txt
      # O pip-audit avalia os marcadores do lock com o Python que o executa. Três passos, para
      # cobrir o lock inteiro: 3.13/Linux, 3.11/Linux e os pins que só existem em Windows/macOS.
      - name: pip-audit (Python 3.13, Linux)
        run: uvx pip-audit -r requisitos-auditoria.txt
      # --disable-pip --no-deps: o lock já é a resolução, e o venv de resolução do pip-audit
      # falhou (ensurepip) com o Python gerenciado pelo uv nos testes locais. O 3.11 é o menor
      # Python suportado (o 3.10 saiu em 2026-10-21); aqui entra o django 5.2, que o 3.13 não
      # instala.
      - name: pip-audit (Python 3.11, Linux)
        run: uvx --python 3.11 pip-audit --disable-pip --no-deps -r requisitos-auditoria.txt
      # `uv export` não tem opção de plataforma. Os pins com marcador sys_platform (pywin32,
      # pywin32-ctypes, pefile, colorama, tzdata, macholib...) saem do mesmo arquivo, sem o
      # marcador, e são auditados por nome e versão.
      - name: pip-audit (pins por plataforma)
        run: |
          sed -n -E 's/^([A-Za-z0-9_.-]+==[^ ;]+) ;.*sys_platform.*$/\1/p' requisitos-auditoria.txt > requisitos-plataformas.txt
          test -s requisitos-plataformas.txt
          uvx pip-audit --disable-pip --no-deps -r requisitos-plataformas.txt
